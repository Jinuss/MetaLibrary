      </div>
    </div>

  <main class="container">
    <!-- Hero 区 -->
    <section class="hero animate-in animate-in--1">
      <h1 class="hero__title">法定退休年龄计算器</h1>

    </section>

    <!-- 输入表单 -->
    <section class="card animate-in animate-in--2">
      <h2 class="card__title">个人信息</h2>

      <div class="form-group">
        <label class="form-label">出生年月</label>
        <div class="form-row">
          <div class="form-group">
            <select class="select" id="birthYear">
              <option value="" disabled selected>选择年份</option>
            </select>
          </div>
          <div class="form-group">
            <select class="select" id="birthMonth">
              <option value="" disabled selected>选择月份</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">性别</label>
        <div class="radio-group" id="genderSeg">
          <label class="radio-item">
            <input type="radio" name="gender" value="male" checked />
            <span>男</span>
          </label>
          <label class="radio-item">
            <input type="radio" name="gender" value="female" />
            <span>女</span>
          </label>
        </div>
      </div>

      <div class="form-group" id="typeGroup" style="display:none;">
        <label class="form-label" id="typeLabel">人员类型</label>

        <span>计算退休年龄</span>

    </section>

      <button class="collapse__header" id="collapseHeader" type="button">
        <span class="collapse__header-left">
          <span class="collapse__header-icon">ℹ</span>
          计算说明
        </span>
        <svg class="collapse__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>
      <div class="collapse__body">
        <div class="collapse__inner">
          <div class="notice">
            <div class="notice__text" id="calcNote">
              <p>计算结果基于<strong>《国务院关于渐进式延迟法定退休年龄的办法》</strong>。</p>
              <p>请先在上方填写个人信息并点击计算，计算后将在此显示详细的计算说明。</p>

    <div class="modal__overlay" data-close></div>
    <article class="modal__card">
      <button class="modal__close" data-close aria-label="关闭">✕</button>
      <h2 class="modal__title">计算结果</h2>

      <div class="result">
        <div class="result__header">
          <div class="result__age-label">改革后法定退休年龄</div>
          <div class="result__age" id="retirementAge">—</div>
        </div>

        <div class="result__grid">
          <div class="result__item">
            <div class="result__item-label">退休时间</div>
            <div class="result__item-value result__item-value--accent" id="retirementDate">—</div>
          </div>
          <div class="result__item">
            <div class="result__item-label">延迟月数</div>
            <div class="result__item-value result__item-value--warning" id="delayMonths">—</div>
          </div>
          <div class="result__item result__item--full">
            <div class="result__item-label">社保最低缴纳时长</div>
            <div class="result__item-value result__item-value--success" id="minContribution">—</div>
            <div class="progress-bar">
              <div class="progress-bar__fill" id="contribProgress" style="width: 0%"></div>
            </div>
            <div class="progress-bar__labels">
              <span>15年</span>
              <span>17.5年</span>
              <span>20年</span>
            </div>
          </div>
          <div class="result__item">
            <div class="result__item-label">原退休年龄</div>
            <div class="result__item-value" id="originalAge">—</div>
          </div>
          <div class="result__item">
            <div class="result__item-label">距今年数</div>
            <div class="result__item-value result__item-value--primary" id="yearsToRetire">—</div>
          </div>
        </div>
      </div>

      <div class="modal__actions">
        <!-- <button class="btn btn--ghost" data-close>关闭</button> -->
        <button class="btn btn--primary" data-close>知道了</button>
      </div>
    </article>
  </div>

  <!-- 页脚 -->
  <footer class="footer">
    <p class="footer__brand">✦ 法定退休年龄计算器</p>
    <p>数据来源：国务院关于渐进式延迟法定退休年龄的办法</p>
    <p style="margin-top: 4px;">仅供参考，具体以官方政策为准 © <span id="year"></span></p>
  </footer>

  <script>
    (function () {
      "use strict";

      // ========== 配置 ==========
      // 三类人员的延迟退休参数
      const RETIREMENT_CONFIG = {
        male_worker: {
          name: "男职工",
          originalAge: 60,
          targetAge: 63,
          startYear: 1965,
          startMonth: 1,
          monthsPerStep: 4,  // 每 N 个月延迟 1 个月
          maxDelay: 36
        },
        female_cadre: {
          name: "女干部/专业技术人员",
          originalAge: 55,
          targetAge: 58,
          startYear: 1970,
          startMonth: 1,
          monthsPerStep: 4,
          maxDelay: 36
        },
        female_worker: {
          name: "女工人",
          originalAge: 50,
          targetAge: 55,
          startYear: 1975,
          startMonth: 1,
          monthsPerStep: 2,
          maxDelay: 60
        }
      };

      // ========== 状态 ==========
      const state = {
        birthYear: "",
        birthMonth: "",
        gender: "male",
        type: "worker", // worker / cadre
        currentType: "male_worker"
      };

      // ========== DOM 元素 ==========
      const els = {
        birthYear: document.getElementById("birthYear"),
        birthMonth: document.getElementById("birthMonth"),
        genderSeg: document.getElementById("genderSeg"),
        typeSelect: document.getElementById("typeSelect"),
        typeLabel: document.getElementById("typeLabel"),
        calcBtn: document.getElementById("calcBtn"),
        collapseHeader: document.getElementById("collapseHeader"),
        calcNoteCollapse: document.getElementById("calcNoteCollapse"),
        resultModal: document.getElementById("resultModal"),
        retirementAge: document.getElementById("retirementAge"),
        retirementDate: document.getElementById("retirementDate"),
        delayMonths: document.getElementById("delayMonths"),
        minContribution: document.getElementById("minContribution"),
        contribProgress: document.getElementById("contribProgress"),
        originalAge: document.getElementById("originalAge"),
        yearsToRetire: document.getElementById("yearsToRetire"),
        calcNote: document.getElementById("calcNote"),
        year: document.getElementById("year")
      };

      // ========== 初始化年份/月份选择 ==========
      function initSelects() {
        const currentYear = new Date().getFullYear();
        // 年份范围：1955 - 2005
        for (let y = 2005; y >= 1955; y--) {
          const opt = document.createElement("option");
          opt.value = y;
          opt.textContent = y + " 年";
          els.birthYear.appendChild(opt);
        }
        // 月份
        for (let m = 1; m <= 12; m++) {
          const opt = document.createElement("option");
          opt.value = m;
          opt.textContent = m + " 月";
          els.birthMonth.appendChild(opt);
        }
        // 默认选中当前年龄约30-40岁的年份（示例）
        els.birthYear.value = 1985;
        els.birthMonth.value = 6;
        state.birthYear = 1985;
        state.birthMonth = 6;
      }

      // ========== 更新人员类型选项 ==========
      function updateTypeOptions() {
        const sel = els.typeSelect;
        const group = document.getElementById("typeGroup");
        sel.innerHTML = "";

        if (state.gender === "male") {
          state.type = "worker";
          state.currentType = "male_worker";
          group.style.display = "none";
        } else {
          group.style.display = "";
          const types = [
            { id: "female_cadre", label: "女干部/专业技术人员（55岁）" },
            { id: "female_worker", label: "女工人（50岁）" }
          ];
          types.forEach((t, i) => {
            const opt = document.createElement("option");
            opt.value = t.id;
            opt.textContent = t.label;
            if (i === 0) opt.selected = true;
            sel.appendChild(opt);
          });
          state.type = "cadre";
          state.currentType = "female_cadre";
        }
      }

      // ========== 计算退休年龄 ==========
      function calculateRetirement() {
        if (!state.birthYear || !state.birthMonth) return null;

        const cfg = RETIREMENT_CONFIG[state.currentType];
        const birthYear = parseInt(state.birthYear, 10);
        const birthMonth = parseInt(state.birthMonth, 10);

        // 计算从起始日期到出生日期的月数
        const monthsFromStart =
          (birthYear - cfg.startYear) * 12 + (birthMonth - cfg.startMonth);

        // 如果在政策实施前就达到退休年龄（不受影响）
        // 政策2025年1月1日实施
        const originalRetireYearMonths = birthYear * 12 + birthMonth + cfg.originalAge * 12;
        const policyStartYearMonths = 2025 * 12 + 1; // 2025年1月

        let delayMonths = 0;

        if (originalRetireYearMonths < policyStartYearMonths) {
          // 2025年之前已退休，不受影响
          delayMonths = 0;
        } else if (monthsFromStart < 0) {
          // 出生在起始年份之前，但退休在2025年及以后
          // 这种情况理论上不会发生在正常的渐进式延迟中
          // 但如果出现，按0延迟处理
          delayMonths = 0;
        } else {
          // 计算延迟月数：每 monthsPerStep 个月延迟 1 个月
          delayMonths = Math.floor(monthsFromStart / cfg.monthsPerStep) + 1;
          // 不超过最大延迟
          delayMonths = Math.min(delayMonths, cfg.maxDelay);
        }

        // 新退休年龄（月）
        const newRetireAgeMonths = cfg.originalAge * 12 + delayMonths;
        const newRetireYears = Math.floor(newRetireAgeMonths / 12);
        const newRetireMonths = newRetireAgeMonths % 12;

        // 退休日期：出生日期 + 新退休年龄
        let retireYear = birthYear + newRetireYears;
        let retireMonth = birthMonth + newRetireMonths;
        if (retireMonth > 12) {
          retireYear += 1;
          retireMonth -= 12;
        }

        // 退休次月生效（根据表格规律，退休时间是出生月对应月的次月？）
        // 查看表格：1965年1月出生 → 2025年2月退休
        // 60岁1个月 = 721个月
        // 1965年1月 + 721个月 = 2025年2月 ✓
        // 所以就是出生日期 + 退休年龄月数，不需要再加1个月

        // 计算最低缴费年限
        const minContribMonths = getMinContributionMonths(retireYear);
        const minContribYears = Math.floor(minContribMonths / 12);
        const minContribRemMonths = minContribMonths % 12;

        // 距今年数
        const now = new Date();
        const nowYearMonths = now.getFullYear() * 12 + (now.getMonth() + 1);
        const retireYearMonths = retireYear * 12 + retireMonth;
        const monthsToRetire = retireYearMonths - nowYearMonths;
        const yearsToRetire = (monthsToRetire / 12).toFixed(1);

        return {
          config: cfg,
          delayMonths,
          newRetireYears,
          newRetireMonths,
          retireYear,
          retireMonth,
          minContribYears,
          minContribRemMonths,
          minContribMonths,
          yearsToRetire: monthsToRetire > 0 ? yearsToRetire : "已退休",
          alreadyRetired: monthsToRetire <= 0
        };
      }

      // ========== 计算最低缴费年限 ==========
      function getMinContributionMonths(retireYear) {
        // 最低缴费年限由15年逐步提高至20年（上限20年）
        // 2025-2029: 15年
        // 2030起每年增加6个月，到2039年达到20年
        // 2040年及以后：保持20年不变
        if (retireYear <= 2029) return 15 * 12;
        const yearsAfter2029 = retireYear - 2029;
        const months = 15 * 12 + yearsAfter2029 * 6;
        return Math.min(months, 20 * 12); // 上限20年
      }

      // ========== 渲染结果 ==========
      function renderResult(result) {
        if (!result) return;

        const { config, delayMonths, newRetireYears, newRetireMonths,
          retireYear, retireMonth, minContribYears, minContribRemMonths,
          minContribMonths, yearsToRetire, alreadyRetired } = result;

        // 退休年龄
        els.retirementAge.textContent = `${newRetireYears}岁${newRetireMonths > 0 ? newRetireMonths + "个月" : ""}`;

        // 退休时间
        els.retirementDate.textContent = `${retireYear}年${retireMonth}月`;

        // 延迟月数
        if (delayMonths === 0) {
          els.delayMonths.textContent = "无延迟";
        } else {
          els.delayMonths.textContent = `${delayMonths} 个月`;
        }

        // 最低缴费时长
        if (minContribRemMonths === 0) {
          els.minContribution.textContent = `${minContribYears} 年（${minContribMonths}个月）`;
        } else {
          els.minContribution.textContent = `${minContribYears} 年 ${minContribRemMonths} 个月（${minContribMonths}个月）`;
        }

        // 进度条（以20年为上限，最低缴费年限最高20年）
        const progressPct = ((minContribMonths - 15 * 12) / (5 * 12)) * 100;
        els.contribProgress.style.width = progressPct + "%";

        // 原退休年龄
        els.originalAge.textContent = `${config.originalAge} 岁`;

        // 距今年数
        if (alreadyRetired) {
          els.yearsToRetire.textContent = "已退休";
        } else {
          els.yearsToRetire.textContent = `${yearsToRetire} 年`;
        }

        // 计算说明
        const noteHtml = `
        <p>根据<strong>《国务院关于渐进式延迟法定退休年龄的办法》</strong>，${config.name}原法定退休年龄为${config.originalAge}周岁，逐步延迟至${config.targetAge}周岁。</p>
        <p>您出生于${state.birthYear}年${state.birthMonth}月，属渐进式延迟退休第${delayMonths > 0 ? delayMonths : "0"}批，每${config.monthsPerStep}个月延迟1个月。</p>
        <p>社保最低缴费年限按退休年份计算，2030年起逐年提高，最高不超过20年。</p>
      `;
        els.calcNote.innerHTML = noteHtml;

        // 打开模态框
        openModal();
      }

      // ========== 模态框控制 ==========
      function openModal() {
        els.resultModal.classList.add("is-open");
        els.resultModal.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }

      function closeModal() {
        els.resultModal.classList.remove("is-open");
        els.resultModal.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
      }

      // ========== 事件绑定 ==========
      function bindEvents() {
        // 年份选择
        els.birthYear.addEventListener("change", (e) => {
          state.birthYear = e.target.value;
        });

        // 月份选择
        els.birthMonth.addEventListener("change", (e) => {
          state.birthMonth = e.target.value;
        });

        // 性别选择
        els.genderSeg.addEventListener("change", (e) => {
          if (e.target.name !== "gender") return;
          state.gender = e.target.value;
          updateTypeOptions();
        });

        // 人员类型选择
        els.typeSelect.addEventListener("change", (e) => {
          state.currentType = e.target.value;
          if (state.gender === "female") {
            state.type = state.currentType === "female_cadre" ? "cadre" : "worker";
          } else {
            state.type = "worker";
          }
        });

        // 计算按钮
        els.calcBtn.addEventListener("click", () => {
          if (!state.birthYear || !state.birthMonth) {
            alert("请选择出生年月");
            return;
          }
          const result = calculateRetirement();
          renderResult(result);
        });

        // 折叠面板展开/收起
        els.collapseHeader.addEventListener("click", () => {
          els.calcNoteCollapse.classList.toggle("is-open");
        });

        // 模态框关闭
        els.resultModal.addEventListener("click", (e) => {
          if (e.target.hasAttribute("data-close") || e.target.closest("[data-close]")) {
            closeModal();
          }
        });

        // ESC 键关闭模态框
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && els.resultModal.classList.contains("is-open")) {
            closeModal();
          }
        });
      }

      // ========== 初始化 ==========
      function init() {
        els.year.textContent = new Date().getFullYear();
        initSelects();
        updateTypeOptions();
        bindEvents();

        // 导航栏滚动效果
        const nav = document.getElementById("nav");
        window.addEventListener("scroll", () => {
          if (window.scrollY > 10) {
            nav.classList.add("scrolled");
          } else {
            nav.classList.remove("scrolled");
          }
        }, { passive: true });
      }

      init();
    })();
  </script>
</body>

</html>
